	}
	function onTurnstileError(errorCode) {
		console.error("Turnstile error:", errorCode);

	}
	function onTurnstileExpired() {
		console.warn("Turnstile token expired");
		document.getElementById("submit-btn").disabled = true;
	}
</script>

<div id="chat-container">
  <div id="chat-messages"></div>
  <form id="chat-form" onsubmit="handleSend(event)">
    <input type="text" id="chat-input" placeholder="Type a message..." required />
    <button type="submit">Send</button>
  </form>
</div>
<script>
  const WORKER_URL = "https://enrique-personal-site.enriquegarciaoropeza.workers.dev/chat";

  const conversationHistory = [
    { role: "system", content: "You are a helpful assistant." }
  ];

  async function handleSend(e) {
    e.preventDefault();
    const input = document.getElementById("chat-input");
    const userText = input.value.trim();

    if (!userText) return;

    conversationHistory.push({ role: "user", content: userText });
    appendMessage(userText, "user");
    input.value = "";

    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: conversationHistory })
      });

      const data = await res.json();

      if (data.response) {
        conversationHistory.push({ role: "assistant", content: data.response });
        appendMessage(data.response, "assistant");
      } else {
        appendMessage("Error processing response.", "assistant");
      }
    } catch (err) {
      appendMessage("Connection error.", "assistant");
    }
  }

  function appendMessage(text, role) {
    const messagesContainer = document.getElementById("chat-messages");
    const msgDiv = document.createElement("div");
    msgDiv.className = `msg ${role}`;
    msgDiv.textContent = text;
    messagesContainer.appendChild(msgDiv);
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
  }
</script>
