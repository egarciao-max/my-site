        <h1>
            Hi, contact me via:
        </h1>
        <br>

        <h2>Mail: <a href="mailto:enrique@oropezas.com">enrique@oropezas.com</a></h2>
        <h2>Instagram: <a href="https://instagram.com/enriquegarciaou">@enriquegarciaou</a><h2></h2>
        <h2>Or via this form:</h2>
        <form id="contact-form">
            <input type="Text" id="name" placeholder="Name" required>
            <input type="Email" id="email" placeholder="Email" required>
            <textarea id="message" placeholder="Message" required></textarea>
            <div
		class="cf-turnstile"
		data-sitekey="0x4AAAAAAECZAptpDFzv1LnJ"
		data-theme="auto"
		data-size="flexible"
		data-callback="onTurnstileSuccess"
		data-error-callback="onTurnstileError"
		data-expired-callback="onTurnstileExpired"
	></div>
	<button type="submit" id="submit-btn" disabled>Send Message</button>
</form>

<script>
	function onTurnstileSuccess(token) {
		console.log("Turnstile success:", token);
		document.getElementById("submit-btn").disabled = false;
	}
	function onTurnstileError(errorCode) {
		console.error("Turnstile error:", errorCode);
		document.getElementById("submit-btn").disabled = true;
	}
	function onTurnstileExpired() {
		console.warn("Turnstile token expired");
		document.getElementById("submit-btn").disabled = true;
	}
</script>
