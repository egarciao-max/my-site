<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Site</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap');
        body{ 
            background-color: rgb(43, 42, 56);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            color: rgb(255, 255, 255);

        }
        div{ background-color: coral;
            height: 100px;
            width: 100px;
        }
        .panel{
           height: auto;
           width: auto;
           border: 1px solid rgba(0, 0, 0, 0.25);
           background-color: rgba(255, 255, 255, 0.15);
           backdrop-filter: blur(16px) saturate(180%);
           -webkit-backdrop-filter: blur(16px) saturate(180%);
           box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
           border-radius: 12px;
           padding: 10px;
           display: flex;
           gap: 15px;
           align-items: center;

        }
        .dancing-script {
        font-family: "Dancing Script", cursive;
        font-optical-sizing: auto;
        font-weight: 200;
        font-style: normal;
        font-size: 50px;
        color: rgb(254, 131, 131);

        }
        .dancing-script-small {
        font-family: "Dancing Script", cursive;
        font-optical-sizing: auto;
        font-weight: 200;
        font-style: normal;
        font-size: 25px;
        color: rgb(254, 131, 131);

        }
        .photo-panel{
            width: 300px;
            height: auto;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.25);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }
        a {
            text-decoration: none;
            color: rgb(255, 255, 255);
        
        }
        a:hover {
            text-decoration: underline;
        }
        .flip-container {
        width: 300px;
        height: 400px;
        perspective: 1000px;
        border-radius: 12px;
        border: .2px solid rgba(0, 0, 0, 0.25);
        box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
        background-color: rgb(43, 42, 56);
        }
        .flip-card{
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-beizer(0.4, 0, 0.2, 1);
            cursor: pointer;
            border-radius: 12px;

        }
        .flip-card.is-flipped{
            transform: rotateY(180deg);
        }
        .card-face { 
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.25);
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
        }
        .card-front {
            background-color: #bbb;
        }
        .card-back {
            background-color: rgb(43, 42, 56);
            color: white;
            transform: rotateY(180deg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.25);
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
        }
        .card-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <header>
        <h1>My Personal Site</h1>
        <nav>
            <a href="#about">About</a>
            <a href="#projects">Projects</a>
        </nav>
        <br>
    </header>
    <section id="home">
        <div class="panel">
        <h2>Hi, I'm <i class="dancing-script">Enrique</i>,  I like to eat.</h2>
        <img src="https://images.unsplash.com/photo-1599974579688-8dbdd335c77f?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8dGFjb3xlbnwwfHwwfHx8MA%3D%3D" alt="Tacos" class="photo-panel">
        </div>
        <br>
        <br>
        <div class="panel">
            <div class="flip-container">
                <div class="flip-card" id="myCard">
                    <div class="card-face card-front">
            <img src="https://cdn.hackclub.com/019fa692-63b4-7bc4-b5b0-b8ac27a19416/e36efd76-3bfb-47b0-bc7c-e94a468e069a.jpeg" alt="Coffee" class="photo-panel">
            </div>
            <div class="card-face card-back">
                <h2>Secret Revealed!</h2>
                <p>This text lives directly behind the photo.</p>
            </div>
            </div>
            </div>
            <h2>I also like to be with my dog, <i class="dancing-script">Coffee</i> (Goldendoodle)</h2>
        </div>
    </section>
    <br>
   <section id="about">
    <div class="panel">
        
    <h2>About Me</h2>
    <p>Hi, My name is <i class="dancing-script-small">Enrique</i>, im 15 years old, Im from Mexico, and I like tacos.</p>
    </div>
    <br>
    
   </section>
    <section id="projects">
        <div class="panel">
    <h2>Projects</h2>
    <p>This Site!</p>
    </div>
</section>
</body>
<script>
    const card = document.getElementById('myCard');
    card.addEventListener('click', function() {
        card.classList.toggle('is-flipped');
    });
</script>
</html>
